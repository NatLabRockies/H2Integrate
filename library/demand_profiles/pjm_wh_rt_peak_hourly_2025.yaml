# prices were expanded to an 8760 hourly series: each day's hourly max
# equals the reported High, the hourly min equals the reported Low, and
# the 24-hour mean equals the reported Wtd-avg price. A diurnal shape
# (evening peak, overnight trough) plus mild noise adds within-day and
# hour-to-hour variation; untraded days are forward/back-filled.
# Source prices are in $/MWh; values below are converted to USD/kWh.
# Units: US dollars per kilowatt-hour (USD/kWh).
