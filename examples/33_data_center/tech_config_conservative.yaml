name: technology_config
description: This plant produces electricity from natural gas using a combined cycle turbine
technologies:
  water_feedstock:
    performance_model:
      model: FeedstockPerformanceModel
    cost_model:
      model: FeedstockCostModel
    model_inputs:
      shared_parameters:
        commodity: water
        commodity_rate_units: galUS/h
      performance_parameters:
        rated_capacity: 1.e6  # galUS/h
      cost_parameters:
        cost_year: 2026
        price: 0.01
        annual_cost: 0.
        start_up_cost: 0.
  data_center:
    performance_model:
      model: DataCenterPerformanceModel
    cost_model:
      model: DataCenterCostModel
    model_inputs:
      shared_parameters:
        system_capacity_mw: 160.
      performance_parameters:
        compute_electrical_efficiency: 0.90
        cooling_load_ratio: 0.2
        water_use_gal_per_mwh: 2400.
        demand_profile: 100.  # MW
      cost_parameters:
        capex_per_mw: 4.0625e6  # $/MW
        fixed_opex_per_mw_per_year: 1.03e7  # $/MW/year
        variable_opex_per_mwh: 0.0  # $/MWh
        cost_year: 2026
  grid_buy:
    performance_model:
      model: GridPerformanceModel
    cost_model:
      model: GridCostModel
    model_inputs:
      shared_parameters:
        interconnection_size: 1.e6  # kW
      cost_parameters:
        cost_year: 2026
        electricity_buy_price: 0.04574  # $/kWh - only buying, no selling
        interconnection_capex_per_kw: 0.0  # $/kW capital cost
        interconnection_opex_per_kw: 0.0  # $/kW/year O&M cost
        fixed_interconnection_cost: 0.0  # $ one-time fixed cost
