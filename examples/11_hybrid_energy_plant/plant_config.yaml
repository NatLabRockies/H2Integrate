name: plant_config
description: Wind, PV, and battery hybrid plant located in TX, USA near Sheffield
sites:
  site:
    latitude: 30.6617
    longitude: -101.7096
    resources:
      wind_resource:
        resource_model: WTKNLRDeveloperAPIWindResource
        resource_parameters:
          resource_year: 2013
          resource_filename: 30.6617_-101.7096_2013_wtk_v2_60min_utc_tz.csv
      solar_resource:
        resource_model: GOESAggregatedSolarAPI
        resource_parameters:
          resource_year: 2013
          resource_filename: 30.6617_-101.7096_psmv3_60_2013.csv
plant:
  plant_life: 30
  simulation:
    n_timesteps: 8760
    dt: 3600
technology_interconnections:
  - [wind, combiner, electricity, cable]
  - [solar, combiner, electricity, cable]
  - [combiner, battery, electricity, cable]
  - [battery, elec_combiner, electricity, cable]
  - [combiner, elec_combiner, electricity, cable]
  - [elec_combiner, electrical_load_demand, electricity, cable]
tech_to_dispatch_connections:
  - [combiner, battery]
  - [battery, battery]
resource_to_tech_connections:
  - [site.wind_resource, wind, wind_resource_data]
  - [site.solar_resource, solar, solar_resource_data]
finance_parameters:
  finance_groups:
    default:
      finance_model: ProFastLCO
      model_inputs:
        params:
          analysis_start_year: 2032
          installation_time: 12  # months
          inflation_rate: 0.025
          discount_rate: 0.089  # nominal return, from 2024 ATB land-based wind
          debt_equity_ratio: 2.1746031746031744  # 72.4% debt, from 2024 ATB
          property_tax_and_insurance: 0.015
          total_income_tax_rate: 0.257
          capital_gains_tax_rate: 0.15
          sales_tax_rate: 0.045
          debt_interest_rate: 0.06
          debt_type: Revolving debt
          loan_period_if_used: 0
          cash_onhand_months: 1
          admin_expense: 0.01
        capital_items:
          depr_type: MACRS
          depr_period: 5
          refurb: [0.]
  finance_subgroups:
    default:
      commodity: electricity
      commodity_stream: elec_combiner
      finance_groups: [default]
      technologies: [wind, solar, battery]
  cost_adjustment_parameters:
    cost_year_adjustment_inflation: 0.025
    target_dollar_year: 2025
