name: plant_config
description: >
  System-level dispatch control example.
  Wind farm + battery + grid serving a 100 MW electrical demand.
sites:
  site:
    latitude: 35.2018863
    longitude: -101.945027
    resources:
      wind_resource:
        resource_model: WTKNLRDeveloperAPIWindResource
        resource_parameters:
          resource_year: 2012
plant:
  plant_life: 30
# Physical wiring: how electricity flows between technologies
technology_interconnections:
  - [wind, battery, electricity, cable]
  - [wind, elec_combiner, electricity, cable]
  - [battery, elec_combiner, electricity, cable]
  - [elec_combiner, electrical_load_demand, electricity, cable]
  - [electrical_load_demand, grid_buy, [unmet_electricity_demand_out, electricity_demand]]
resource_to_tech_connections:
  - [site.wind_resource, wind, wind_resource_data]
# System-level control: declares which technologies participate in
# coordinated dispatch and what roles they play.
# A standalone SystemLevelController component is added to the plant
# group and wired to the participating technologies automatically.
system_level_control:
  commodity_streams:
    electricity:
      units: kW
      producers:
        - tech: wind
          role: fixed  # wind output is non-controllable for now
        - tech: grid_buy
          role: dispatchable  # grid can provide any amount up to limit
      storage:
        - tech: battery
      demands:
        - tech: electrical_load_demand
finance_parameters:
  finance_groups:
    profast_model:
      commodity: electricity
      finance_model: ProFastLCO
      model_inputs:
        params:
          analysis_start_year: 2032
          installation_time: 36
          inflation_rate: 0.0
          discount_rate: 0.09
          debt_equity_ratio: 2.62
          property_tax_and_insurance: 0.03
          total_income_tax_rate: 0.257
          capital_gains_tax_rate: 0.15
          sales_tax_rate: 0.07375
          debt_interest_rate: 0.07
          debt_type: Revolving debt
          loan_period_if_used: 0
          cash_onhand_months: 1
          admin_expense: 0.00
        capital_items:
          depr_type: MACRS
          depr_period: 5
          refurb: [0.]
  cost_adjustment_parameters:
    cost_year_adjustment_inflation: 0.025
    target_dollar_year: 2022
  finance_subgroups:
    electricity:
      commodity: electricity
      commodity_stream: elec_combiner
      finance_groups: [profast_model]
      technologies: [wind, battery, grid_buy]
