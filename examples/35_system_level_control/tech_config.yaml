name: technology_config
description: >
  Wind + Battery + Grid system with system-level dispatch control.
  Wind provides intermittent electricity, a battery stores excess,
  the grid fills any remaining gap, and a fixed demand must be met.
technologies:
  wind:
    performance_model:
      model: PYSAMWindPlantPerformanceModel
    cost_model:
      model: ATBWindPlantCostModel
    model_inputs:
      performance_parameters:
        num_turbines: 25
        turbine_rating_kw: 8300
        rotor_diameter: 196.
        hub_height: 130.
        create_model_from: default
        config_name: WindPowerSingleOwner
        pysam_options: !include library/pysam_options_8.3MW.yaml
        run_recalculate_power_curve: false
        layout:
          layout_mode: basicgrid
          layout_options:
            row_D_spacing: 10.0
            turbine_D_spacing: 10.0
            rotation_angle_deg: 0.0
            row_phase_offset: 0.0
            layout_shape: square
      cost_parameters:
        capex_per_kW: 1500.0
        opex_per_kW_per_year: 45
        cost_year: 2019
  battery:
    performance_model:
      model: StoragePerformanceModel
    cost_model:
      model: ATBBatteryCostModel
    model_inputs:
      shared_parameters:
        commodity: electricity
        commodity_rate_units: kW
        max_charge_rate: 100000  # kW (100 MW)
        max_capacity: 400000  # kWh (400 MWh)
        max_soc_fraction: 0.9
        min_soc_fraction: 0.1
        init_soc_fraction: 0.5
        max_discharge_rate: 100000  # kW (100 MW)
        charge_efficiency: 0.95
        discharge_efficiency: 0.95
        demand_profile: 100000  # kW (100 MW)
      cost_parameters:
        cost_year: 2022
        energy_capex: 310  # $/kWh
        power_capex: 311  # $/kW
        opex_fraction: 0.25
  grid_buy:
    performance_model:
      model: GridPerformanceModel
    cost_model:
      model: GridCostModel
    model_inputs:
      shared_parameters:
        interconnection_size: 1.e6  # kW
      cost_parameters:
        cost_year: 2022
        electricity_buy_price: 0.10  # $/kWh
        interconnection_capex_per_kw: 0.0
        interconnection_opex_per_kw: 0.0
        fixed_interconnection_cost: 0.0
  elec_combiner:
    performance_model:
      model: GenericCombinerPerformanceModel
    model_inputs:
      performance_parameters:
        commodity: electricity
        commodity_rate_units: kW
  electrical_load_demand:
    performance_model:
      model: GenericDemandComponent
    model_inputs:
      performance_parameters:
        commodity: electricity
        commodity_rate_units: kW
        demand_profile: 100000  # kW (100 MW)
