name: technology_config
description: Wind and solar PV combined with a battery power an electrolyzer that feeds an ammonia synthesis loop, with the
  system-level controller translating ammonia demand backward into hydrogen and electricity demand.
technologies:
  solar:
    performance_model:
      model: PYSAMSolarPlantPerformanceModel
    cost_model:
      model: ATBUtilityPVCostModel
    model_inputs:
      performance_parameters:
        pv_capacity_kWdc: 100000  # 100 MWdc, sized so the load sits within the array's midday reach
        dc_ac_ratio: 1.34
        create_model_from: new
        tilt_angle_func: lat-func
        pysam_options:
          SystemDesign:
            gcr: 0.3
            array_type: 2
            bifaciality: 0.65
            inv_eff: 96.0
            losses: 14.6
            module_type: 1
            azimuth: 180
            rotlim: 45
          SolarResource:
            albedo_default: 0.2
      cost_parameters:
        capex_per_kWac: 1367  # 2022 costs from ATB 2024 v3
        opex_per_kWac_per_year: 24  # 2022 costs from ATB 2024 v3
        cost_year: 2022
  wind:
    performance_model:
      model: PYSAMWindPlantPerformanceModel
    cost_model:
      model: ATBWindPlantCostModel
    model_inputs:
      performance_parameters:
        num_turbines: 17  # 17 x 6 MW = 102 MW, a reasonable complement to the 100 MWdc solar array
        turbine_rating_kw: 6000
        hub_height: 115
        rotor_diameter: 170
        create_model_from: default
        config_name: WindPowerSingleOwner
        pysam_options:
          Farm:
            wind_farm_wake_model: 0
          Losses:
            ops_strategies_loss: 10.0
        layout:
          layout_mode: basicgrid
          layout_options:
            row_D_spacing: 5.0
            turbine_D_spacing: 5.0
            rotation_angle_deg: 0.0
            row_phase_offset: 0.0
            layout_shape: square
      cost_parameters:
        capex_per_kW: 1300
        opex_per_kW_per_year: 39
        cost_year: 2022
  battery:
    performance_model:
      model: StoragePerformanceModel
    cost_model:
      model: GenericStorageCostModel
    model_inputs:
      shared_parameters:
        commodity: electricity
        commodity_rate_units: kW
        max_charge_rate: 40000  # kW (40 MW)
        max_capacity: 400000  # kWh (400 MWh, 8-hour duration)
        init_soc_fraction: 0.5
        max_soc_fraction: 1.0
        min_soc_fraction: 0.1
      performance_parameters:
        round_trip_efficiency: 0.90
        demand_profile: 40000  # kW, required by storage base config
      cost_parameters:
        cost_year: 2022
        capacity_capex: 310  # $/kWh
        charge_capex: 311  # $/kW
        opex_fraction: 0.025
  gen_combiner:
    performance_model:
      model: GenericCombinerPerformanceModel
    model_inputs:
      performance_parameters:
        # Combine the wind and solar generation into a single stream before it
        # reaches the battery and the downstream electricity bus.
        commodity: electricity
        commodity_rate_units: kW
        in_streams: 2
  elec_combiner:
    performance_model:
      model: GenericCombinerPerformanceModel
    model_inputs:
      performance_parameters:
        commodity: electricity
        commodity_rate_units: kW
        in_streams: 2
  electricity_splitter:
    performance_model:
      model: GenericSplitterPerformanceModel
    model_inputs:
      performance_parameters:
        # The synloop's direct electricity is split off the same combined bus
        # that feeds the electrolyzer. The system-level controller sets the
        # prescribed amount sent to the priority tech (the electrolyzer) each
        # timestep so the split matches the backpropagated electricity demand.
        split_mode: prescribed_commodity
        commodity: electricity
        commodity_rate_units: kW
        prescribed_commodity_to_priority_tech: 0.0
  electrolyzer:
    performance_model:
      model: ECOElectrolyzerPerformanceModel
    cost_model:
      model: SingliticoCostModel
    model_inputs:
      shared_parameters:
        location: onshore
        electrolyzer_capex: 1295  # $/kW overnight installed capital costs for a 1 MW system in 2022 USD/kW
      performance_parameters:
        size_mode: normal
        n_clusters: 15  # 15 x 3 MW = 45 MW, sized so the load sits within the solar array's reach
        cluster_rating_MW: 3
        eol_eff_percent_loss: 30  # big degradation to demonstrate the changing conversion ratios
        uptime_hours_until_eol: 80000.  # number of 'on' hours until electrolyzer reaches eol
        include_degradation_penalty: true  # include degradation
        turndown_ratio: 0.1  # turndown_ratio = minimum_cluster_power/cluster_rating_MW
        ramp_up_rate_fraction: 0.2  # fraction of electrolyzer rating per timestep
        ramp_down_rate_fraction: 0.2  # fraction of electrolyzer rating per timestep
      financial_parameters:
        capital_items:
          depr_period: 7
          replacement_cost_percent: 0.15  # percent of capex - H2A default case
  h2_storage:
    performance_model:
      model: StoragePerformanceModel
    cost_model:
      model: GenericStorageCostModel
    model_inputs:
      shared_parameters:
        commodity: hydrogen
        commodity_rate_units: kg/h
        max_charge_rate: 1200.0  # kg/time step
        max_capacity: 3700.0  # kg
      performance_parameters:
        max_soc_fraction: 1.0  # fraction (0-1)
        min_soc_fraction: 0.1  # fraction (0-1)
        init_soc_fraction: 0.1  # fraction (0-1)
        max_discharge_rate: 1200.0  # kg/time step
        charge_efficiency: 1.0  # fraction (0-1)
        discharge_efficiency: 1.0  # fraction (0-1)
        demand_profile: 4000.0  # kg/h (see commodity_rate_units)
      cost_parameters:
        cost_year: 2022
        capacity_capex: 100  # $/kg
        charge_capex: 100  # $/kg/h
        opex_fraction: 0.025
  h2_combiner:
    performance_model:
      model: GenericCombinerPerformanceModel
    model_inputs:
      performance_parameters:
        commodity: hydrogen
        commodity_rate_units: kg/h
  n2_feedstock:
    performance_model:
      model: FeedstockPerformanceModel
    cost_model:
      model: FeedstockCostModel
    model_inputs:
      shared_parameters:
        commodity: nitrogen
        commodity_rate_units: t/h
      performance_parameters:
        rated_capacity: 6.0  # metric tonnes of N2/hour (oversized so ammonia is hydrogen-limited)
      cost_parameters:
        cost_year: 2022
        price: 5.0
        annual_cost: 0.
        start_up_cost: 0.0
  ammonia:
    performance_model:
      model: AmmoniaSynLoopPerformanceModel
    cost_model:
      model: AmmoniaSynLoopCostModel
    model_inputs:
      shared_parameters:
        production_capacity: 4000.0  # kg ammonia per hour
        catalyst_consumption_rate: 0.000091295354067341
        catalyst_replacement_interval: 3
      performance_parameters:
        size_mode: normal
        capacity_factor: 0.9
        energy_demand: 0.530645243  # kWh electricity per kg ammonia
        heat_output: 0.8299956
        feed_gas_t: 25.8
        feed_gas_p: 20
        feed_gas_x_n2: 0.25
        feed_gas_x_h2: 0.75
        feed_gas_mass_ratio: 1.13
        purge_gas_t: 7.5
        purge_gas_p: 275
        purge_gas_x_n2: 0.26
        purge_gas_x_h2: 0.68
        purge_gas_x_ar: 0.02
        purge_gas_x_nh3: 0.04
        purge_gas_mass_ratio: 0.07
        turndown_ratio: 0.2
        ramp_up_rate_fraction: 0.6
        ramp_down_rate_fraction: 0.6
        include_cold_start: false
        include_warm_start: false
      cost_parameters:
        baseline_capacity: 52777.6
        base_cost_year: 2016
        capex_scaling_exponent: 0.6
        labor_scaling_exponent: 0.25
        asu_capex_base: 236920646
        synloop_capex_base: 302460908
        heat_capex_base: 7069100
        cool_capex_base: 4799200
        other_eqpt_capex_base: 0
        land_capex_base: 4112701.84103543
        deprec_noneq_capex_rate: 0.42
        labor_rate_base: 57
        num_workers_base: 50
        hours_yr: 2080
        gen_admin: 0.2
        prop_tax_ins: 0.02
        maint_rep: 0.005
        oxygen_byproduct_rate: 0.29405077250145
        water_consumption_rate: 0.049236824
        rebuild_cost_base: 0
        cooling_water_cost_base: 0.000113349938601175
        catalyst_cost_base: 23.19977341
        oxygen_price_base: 0.0285210891617726
  ammonia_load_demand:
    performance_model:
      model: GenericDemandComponent
    model_inputs:
      performance_parameters:
        commodity: ammonia
        commodity_rate_units: kg/h
        demand_profile: 4000.0  # constant ammonia demand (kg/h)
