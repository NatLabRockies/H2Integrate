name: plant_config
description: This plant is located in Texas, USA.
sites:
  site:
    latitude: 30.6617
    longitude: -101.7096
    resources:
      wind_resource:
        resource_model: WTKNLRDeveloperAPIWindResource
        resource_parameters:
          resource_year: 2013
      solar_resource:
        resource_model: OpenMeteoHistoricalSolarResource
        resource_parameters:
          resource_year: 2013
          resource_filename: 30.6617_-101.7096_2013_openmeteo_archive_solar_60min_utc_tz.csv
# array of arrays containing left-to-right technology interconnections
technology_interconnections:
  # combine the wind and solar generation into a single stream
  - [wind, gen_combiner, electricity, cable]
  - [solar, gen_combiner, electricity, cable]
  # combined generation is available for battery charging (electricity_in)
  - [gen_combiner, battery, electricity, cable]
  # combined generation also feeds the downstream electricity bus
  - [gen_combiner, elec_combiner, electricity, cable]
  # battery net output to the combined electricity bus
  - [battery, elec_combiner, electricity, cable]
  # combined electricity feeds a literal splitter that divides the shared bus
  - [elec_combiner, electricity_splitter, electricity, cable]
  # splitter out1 (priority tech) supplies the electrolyzer
  - [electricity_splitter, electrolyzer, electricity, cable]
  # splitter out2 supplies the ammonia synthesis loop's direct electricity
  - [electricity_splitter, ammonia, electricity, cable]
  # electrolyzer to hydrogen storage
  - [electrolyzer, h2_storage, hydrogen, pipe]
  # combine the hydrogen streams from the electrolyzer and storage
  - [electrolyzer, h2_combiner, hydrogen, pipe]
  - [h2_storage, h2_combiner, hydrogen, pipe]
  # hydrogen supply to the ammonia synthesis loop
  - [h2_combiner, ammonia, hydrogen, pipe]
  # nitrogen feedstock for the synthesis loop
  - [n2_feedstock, ammonia, nitrogen, pipe]
  # ammonia supply to the ammonia demand
  - [ammonia, ammonia_load_demand, ammonia, pipe]
resource_to_tech_connections:
  # connect the wind resource to the wind technology
  - [site.wind_resource, wind, wind_resource_data]
  # connect the solar resource to the solar technology
  - [site.solar_resource, solar, solar_resource_data]
plant:
  plant_life: 30
  simulation:
    n_timesteps: 8760
    dt: 3600
system_level_control:
  control_strategy: ProfitMaximizationControl
  demand_component: ammonia_load_demand
  # Profit-maximizing dispatch. The controller honors each technology's control
  # classification, which produces the desired behavior for this plant:
  #   - wind and solar are flexible, so they always run at their available (curtailable) output;
  #   - the battery is storage, so it charges on surplus and discharges to cover deficits.
  # There is no firm grid backup, so the electricity supply is limited to what wind, solar, and
  # the battery can provide. The ammonia demand is therefore not met in every hour, which
  # is expected for this wind-plus-solar-plus-battery only configuration.
  # Ammonia is produced at every timestep where its sell price exceeds its marginal
  # cost, so the whole chain runs whenever ammonia production is profitable.
  control_parameters:
    commodity_sell_price: 0.60  # USD/kg ammonia sell price (above the marginal cost so demand is served)
    cost_per_tech:
      # Ammonia marginal cost is taken from its upstream nitrogen feedstock; wind, solar, and
      # the battery are not feedstocks and are not summed here. The synloop's direct
      # electricity is supplied by the shared electricity bus rather than a dedicated
      # feedstock, so it is costed through the electricity dispatch instead.
      ammonia: feedstock
  solver_options:
    solver_name: gauss_seidel
    max_iter: 50
    convergence_tolerance: 1.0e-6
    rtol: 1.0e-5  # relative residual tolerance; loosened from 1e-6 to match the dispatch floor
    solver_option_kwargs:
      use_aitken: true  # Aitken relaxation damps the Gauss-Seidel dispatch limit cycle
finance_parameters:
  finance_groups:
    profast_lco:
      finance_model: ProFastLCO
      model_inputs:
        params:
          analysis_start_year: 2032
          installation_time: 36  # months
          inflation_rate: 0.0  # 0 for nominal analysis
          discount_rate: 0.09
          debt_equity_ratio: 2.62
          property_tax_and_insurance: 0.03
          total_income_tax_rate: 0.257
          capital_gains_tax_rate: 0.15
          sales_tax_rate: 0.07375
          debt_interest_rate: 0.07
          debt_type: Revolving debt
          loan_period_if_used: 0
          cash_onhand_months: 1
          admin_expense: 0.00
        capital_items:
          depr_type: MACRS
          depr_period: 5
          refurb: [0.]
  finance_subgroups:
    ammonia:
      commodity: ammonia
      commodity_stream: ammonia
      finance_groups: [profast_lco]
      technologies:
        - wind
        - solar
        - battery
        - electrolyzer
        - h2_storage
        - n2_feedstock
        - ammonia
  cost_adjustment_parameters:
    cost_year_adjustment_inflation: 0.025  # used to adjust modeled costs to target_dollar_year
    target_dollar_year: 2022
