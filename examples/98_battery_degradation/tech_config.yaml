name: technology_config
description: >
  Single battery technology using the SimSES-backed BatteryPerformanceModel and
  PeakLoadManagementOptimizedStorageController with winter Exclusive Control Months.
technologies:
  battery:
    performance_model:
      model: BatteryPerformanceModel
    cost_model:
      model: ATBBatteryCostModel
    control_strategy:
      model: PeakLoadManagementOptimizedStorageController
    model_inputs:
      shared_parameters:
        commodity: electricity
        commodity_rate_units: kW
        commodity_amount_units: kW*h  # amount units for the commodity (defaults to <rate>*h)
        max_charge_rate: 2000.0  # kW
        max_capacity: 3854.0  # kWh (usable, 10-90 % of the 4817 kWh nominal pack)
        max_soc_fraction: 0.9  # fraction (0-1)
        min_soc_fraction: 0.1  # fraction (0-1)
        init_soc_fraction: 0.9  # fraction (0-1)
        charge_efficiency: 1.0  # fraction (0-1)
        discharge_efficiency: 1.0  # fraction (0-1)
      performance_parameters:
        max_discharge_rate: 2000.0  # kW
        demand_profile: 0.0  # kW
        series_count: 336
        parallel_count: 16
        battery_temperature_c: 25.0
        converter_efficiency: 0.96
        converter_max_power: 2400.0  # kW
        deg_scale: 0.115  # degradation scaling (notebook-calibrated for the container+HVAC thermal model)
        eol_soh_capacity: 0.8  # capacity SOH at which the battery is replaced (0.8 = 20 % fade)
        azimuth: 0.0  # container orientation, compass bearing of the north face (0 = North)
        # latitude/longitude come from site_to_tech_connections in plant_config.yaml,
        # not tech_config.
      control_parameters:
        system_commodity_interface_limit: 1.0e6
        lmp_signal: []  # Filled to the simulation horizon by the example runner.
        demand_signal: []  # Local site demand profile generated by the example runner.
        upstream_pricingfunction_coeffs: [1.05, 0.02]
        peak_window:
          start: 16:00:00
          end: 20:00:00
        performance_incentive: 0.15  # $/kWh during Exclusive Control Months
        n_max_events: 10
        signal_threshold_percentile: 95.0
        n_control_window_hours: 24
        event_duration:
          units: h
          val: 4
        min_peak_separation:
          units: h
          val: 4
        exclusive_control_months: [12, 1, 2, 3]
        max_cycles_per_day: 1.0
        energy_rate: 0.07  # $/kWh for off-month bill minimization
        demand_charge_rate: 15.0  # $/kW-month
        demand_charge_window:
          start: 16:00:00
          end: 20:00:00
      cost_parameters:
        cost_year: 2022
        energy_capex: 300.0  # $/kWh (ATB utility-scale battery, energy component)
        power_capex: 100.0  # $/kW (ATB utility-scale battery, power component)
        opex_fraction: 0.025  # annual fixed O&M as a fraction of total system CapEx
      financial_parameters:
        capital_items:
          # Each end-of-life replacement (from the model's replacement_schedule) costs a
          # full new battery. Depreciation defaults come from the plant-level capital_items.
          replacement_cost_percent: 1.0
  electricity_feedstock:
    performance_model:
      model: FeedstockPerformanceModel
    model_inputs:
      shared_parameters:
        commodity: electricity
        commodity_rate_units: kW
      performance_parameters:
        rated_capacity: 1000000.0  # kW available to the controller
