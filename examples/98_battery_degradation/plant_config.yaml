name: plant_config
description: >
  Single-battery plant that exercises the SimSES-backed BatteryPerformanceModel over a
  long horizon for degradation analysis. An optimized controller dispatches the battery
  over rolling 24-hour windows, with winter Exclusive Control Months and off-month
  bill minimization. An electricity feedstock provides charging availability.
sites:
  site:
    latitude: 39.755
    longitude: -105.221
    resources:
      solar_resource:
        resource_model: GOESAggregatedSolarAPI
        resource_parameters:
          resource_year: 2012
          resource_year_order: [2012, 2012]  #, 2012, 2012, 2012, 2012, 2012, 2012, 2012, 2012, 2012, 2012, 2012, 2012, 2012]
          resource_filename: [39.7555_-105.2211_psmv3_60_2012.csv, 39.7555_-105.2211_psmv3_60_2012.csv]
          upsample_method: time
plant:
  plant_life: 30
  simulation:
    # 15-year degradation study at 15-min resolution (matches the partner reference
    # script): 15 years * 365 days * 96 steps/day = 525600 steps. n_timesteps * dt may
    # cover any horizon up to plant_life years.
    n_timesteps: 70080  # 525600
    dt: 900
    timezone: 0
    start_time: 01/01/2026 00:00:00
# Left-to-right technology interconnections.
technology_interconnections:
  - [electricity_feedstock, battery, electricity, cable]
tech_to_dispatch_connections:
  - [electricity_feedstock, battery]
  - [battery, battery]
site_to_tech_connections:
  # connect the solar resource (ambient temperature, GHI) to the battery
  - [site.solar_resource, battery, solar_resource_data]
  # connect the site location to the battery for solar heat-gain pre-computation
  - [site, battery, latitude]
  - [site, battery, longitude]
finance_parameters:
  finance_groups:
    profast_model:
      commodity: electricity
      finance_model: ProFastLCO
      model_inputs:
        params:
          analysis_start_year: 2025
          installation_time: 12
          inflation_rate: 0.025
          discount_rate: 0.09
          debt_equity_ratio: 2.62
          property_tax_and_insurance: 0.015
          total_income_tax_rate: 0.257
          capital_gains_tax_rate: 0.15
          sales_tax_rate: 0.045
          debt_interest_rate: 0.06
          debt_type: Revolving debt
          loan_period_if_used: 0
          cash_onhand_months: 1
          admin_expense: 0.01
        capital_items:
          depr_type: MACRS
          depr_period: 5
          refurb: [0.]
  cost_adjustment_parameters:
    cost_year_adjustment_inflation: 0.025
    target_dollar_year: 2022
  finance_subgroups:
    # The battery is the commodity stream: its per-year (degradation-aware) capacity factor
    # drives the ProFAST cash-flow / LCOE analysis over the full 30-year plant life.
    battery:
      commodity: electricity
      commodity_stream: battery
      finance_groups: [profast_model]
      technologies: [battery]
