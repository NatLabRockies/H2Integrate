name: plant_config
description: >
  Single-battery plant that exercises the SimSES-backed BatteryPerformanceModel over a
  long horizon for degradation analysis. The battery follows a fixed daily charge/discharge
  set-point; it BUYS electricity from the grid to charge (grid_buy) and SELLS its discharge
  back to the grid (grid_sell), so the ProFAST analysis captures grid purchase cost and
  sales revenue.
plant:
  plant_life: 30
  simulation:
    # 15-year degradation study at 15-min resolution (matches the partner reference
    # script): 15 years * 365 days * 96 steps/day = 525600 steps. n_timesteps * dt may
    # cover any horizon up to plant_life years.
    n_timesteps: 525600
    dt: 900
# Left-to-right technology interconnections.
technology_interconnections:
  # grid_buy supplies the battery while charging (also gives the storage its required
  # input connection). The purchase amount is driven by the battery charge profile set
  # on grid_buy.electricity_set_point in the run script.
  - [grid_buy, battery, electricity, cable]
  # The battery discharge stream is sold to the grid.
  - [battery, grid_sell, [storage_electricity_discharge, electricity_in]]
finance_parameters:
  finance_groups:
    profast_model:
      commodity: electricity
      finance_model: ProFastLCO
      model_inputs:
        params:
          analysis_start_year: 2025
          installation_time: 12
          inflation_rate: 0.025
          discount_rate: 0.09
          debt_equity_ratio: 2.62
          property_tax_and_insurance: 0.015
          total_income_tax_rate: 0.257
          capital_gains_tax_rate: 0.15
          sales_tax_rate: 0.045
          debt_interest_rate: 0.06
          debt_type: Revolving debt
          loan_period_if_used: 0
          cash_onhand_months: 1
          admin_expense: 0.01
        capital_items:
          depr_type: MACRS
          depr_period: 5
          refurb: [0.]
  cost_adjustment_parameters:
    cost_year_adjustment_inflation: 0.025
    target_dollar_year: 2022
  finance_subgroups:
    # The battery is the commodity stream: its per-year (degradation-aware) capacity factor
    # drives the ProFAST cash-flow / LCOE analysis over the full 30-year plant life. The
    # grid technologies contribute the electricity purchase cost (grid_buy) and sales
    # revenue (grid_sell) as variable operating costs.
    battery:
      commodity: electricity
      commodity_stream: battery
      finance_groups: [profast_model]
      technologies: [battery, grid_buy, grid_sell]
