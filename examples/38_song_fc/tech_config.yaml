name: technology_config
description: This hybrid plant produces ammonia
technologies:
  SONG_fuel_cell:
    performance_model:
      model: SONGFuelCellPerformanceModel
    cost_model:
      model: GenericConverterCostModel
    model_inputs:
      performance_parameters:
        system_capacity_kw: 1500
        n_stacks: 60
        stack_temperature_K: 1073
        hhv: 15.4  # kWh/kg --> based on methane
      cost_parameters:
        commodity: electricity
        commodity_rate_units: kW
        commodity_amount_units: kW*h
        unit_capex: 3174  # USD/kW
        unit_opex: 35  # USD/kW/year
        unit_varopex: 0.0  # USD/kWh
        cost_year: 2026
  electricity_load_demand:
    performance_model:
      model: GenericDemandComponent
    model_inputs:
      performance_parameters:
        commodity: electricity
        commodity_rate_units: kW
        demand_profile: 1000
  ng_feedstock:
    performance_model:
      model: FeedstockPerformanceModel
    cost_model:
      model: FeedstockCostModel
    model_inputs:
      shared_parameters:
        commodity: natural_gas
        commodity_rate_units: MMBtu/h
      performance_parameters:
        rated_capacity: 30.0  # MMBtu/h of natural gas
      cost_parameters:
        cost_year: 2022
        price: 0.1
        annual_cost: 0.
        start_up_cost: 0.0
  o2_feedstock:
    performance_model:
      model: FeedstockPerformanceModel
    cost_model:
      model: FeedstockCostModel
    model_inputs:
      shared_parameters:
        commodity: oxygen
        commodity_rate_units: kg/h
      performance_parameters:
        rated_capacity: 650.0  # kg/h of oxygen
      cost_parameters:
        cost_year: 2022
        price: 0.5  # $0.5/kg of oxygen. price is extremely variable
        annual_cost: 0.
        start_up_cost: 0.0
