$schema: http://json-schema.org/draft-07/schema#
$id: technology_config_schema_v01
title: Technology Configuration Schema
description: Schema to validate technology configurations, including performance and cost models
type: object
properties:
  name:
    type: string
    description: Name of the technology configuration
    default: technology_config
  description:
    type: string
    description: Description of the technology configuration
    default: technology configuration for energy system
  technologies:
    type: object
    description: Technologies included in the configuration
    patternProperties:
      .*:  # Allows any string as the key (e.g., wind, electrolyzer)
        type: object
        properties:
          performance_model:
            type: object
            properties:
              model:
                type: string
                description: Name of the performance model
              model_location:
                type: [string, Path]
                description: Filepath for a custom technology performance model
            required: [model]
            additionalProperties: false
            description: Performance model name
          cost_model:
            type: object
            properties:
              model:
                type: string
                description: Name of the cost model
              model_location:
                type: [string, Path]
                description: Filepath for a custom technology cost model
            required: [model]
            additionalProperties: false
            description: Cost model name
          finance_model:
            type: object
            properties:
              model:
                type: string
                description: Name of the technology finance model
              model_location:
                type: [string, Path]
                description: Filepath for a custom technology finance model
            required: [model]
            additionalProperties: false
            description: Technology finance model name
          # include dispatch_rule_set?
          model_inputs:
            type: object
            description: Detailed configuration parameters (optional)
            properties:
              shared_parameters:
                type: object
                description: Parameters that are shared between at least 2 of the models
              performance_parameters:
                type: object
                description: Input parameters for the performance model
              cost_parameters:
                type: object
                description: Input parameters for the cost model
              financial_parameters:
                type: object
                description: Input parameters for the finance model
              control_parameters:
                type: object
                description: Input parameters for the technology control model
              # include dispatch_parameters?
        required: [performance_model, model_inputs]
        additionalProperties: true  # can set to false if put dispatch_rule_set in
required: [name, description, technologies]
