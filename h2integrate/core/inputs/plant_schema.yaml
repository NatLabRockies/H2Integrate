$schema: http://json-schema.org/draft-07/schema#
$id: plant_config_schema_v01
title: Plant Configuration Schema
description: Schema to validate plant configurations including site details and plant properties
type: object
properties:
  name:
    type: string
    description: Name of the plant configuration
    default: plant_config
  description:
    type: string
    description: Description of the plant configuration
    default: plant configuration
  sites:
    type: object
    description: Sites included in the configuration
    patternProperties:
      .*:  # Allows any string as the key (e.g., site, wind_site, etc)
        type: object
        properties:
          latitude:
            type: number
            description: Latitude of the site in decimal degrees
            minimum: -90
            maximum: 90
          longitude:
            type: number
            description: Longitude of the site in decimal degrees
            minimum: -180
            maximum: 180
          elevation:
            type: number
            description: Elevation of the site in meters
            minimum: 0
          resources:
            type: object
            description: Resource models for this site
            patternProperties:
              .*:  # Allows any string as the key (e.g., wind_resource, solar_resource)
                type: object
                properties:
                  resource_model:
                    type: string
                    description: Name of the resource model class
                  resource_parameters:
                    type: object
                    description: Input parameters for the resource model
              required: [resource_model, resource_parameters]
          required: [latitude, longitude]
  plant:
    type: object
    properties:
      plant_life:
        type: number
        description: Plant lifetime in years
        minimum: 1
        default: 30
      simulation:
        type: object
        default: {}
        properties:
          dt:
            type: number
            description: simulation time-step in seconds
            default: 3600
          n_timesteps:
            type: number
            description: number of timesteps to simulate
            default: 8760
            minimum: 1
          start_time:
            type: string
            description: simulation start time formatted as mm/dd/yyyy HH:MM:SS or mm/dd HH:MM:SS
            default: 01/01 00:30:00
          timezone:
            type: number
            description: timezone as UTC offset corresponding to start_time
            default: 0
            minimum: -12
            maximum: 14
        required: [dt, n_timesteps]
    required: [plant_life, simulation]
  technology_interconnections:
    type: array
    description: Array of arrays representing technology interconnections
    items:
      type: array
      items:
        type: [string, array]
        description: Technology names and connection types
  resource_to_tech_connections:
    type: array
    description: Array of arrays representing resource to technology connections
    items:
      type: array
      items:
        type: [string, array]
        description: Connecting resource data from a site to a performance model

  # should we add in finance_parameters, finance_subgroups, and cost_adjustment_parameters?
required: [name, description]  # should plant be required?
